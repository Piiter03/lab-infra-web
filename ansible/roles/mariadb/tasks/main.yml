---
- name: Directorio del proyecto
  ansible.builtin.file:
    path: "{{ mariadb_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Archivo docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mariadb_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Archivo .env con las credenciales (no se muestra su contenido)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ mariadb_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
    backup: true
  no_log: true
  diff: false

- name: Levantar MariaDB
  community.docker.docker_compose_v2:
    project_src: "{{ mariadb_dir }}"
    state: present
