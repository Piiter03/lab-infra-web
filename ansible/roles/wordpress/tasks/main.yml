---
- name: Crear el directorio del despliegue
  ansible.builtin.file:
    path: "{{ wordpress_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Generar docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wordpress_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# WordPress no necesita la contraseña de root de la base de datos,
# por eso este .env solo lleva tres variables.
- name: Generar .env con las credenciales (desde Vault)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ wordpress_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
    backup: true
  no_log: true
  diff: false

- name: Levantar WordPress
  community.docker.docker_compose_v2:
    project_src: "{{ wordpress_dir }}"
    state: present
