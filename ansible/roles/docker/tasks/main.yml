---
- name: Añadir la clave GPG del repositorio de Docker
  ansible.builtin.rpm_key:
    key: https://download.docker.com/linux/rhel/gpg
    state: present

- name: Añadir el repositorio oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"

- name: Instalar Docker
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: present

- name: Habilitar y arrancar Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Añadir usuarios al grupo docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
